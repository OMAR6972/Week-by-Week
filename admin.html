<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Admin Dashboard</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-topbar">
    <button class="btn-hamburger" onclick="toggleSidebar()" title="Toggle navigation">☰</button>
    <span id="save-status" style="font-size:0.75rem; color:#666; margin-left:8px;"></span>
    <button class="btn btn-save" onclick="saveData()">💾 Save to site</button>
    <button class="btn" onclick="exportBackupFile()" title="Download a backup copy of all data" style="margin-left:6px;">⬇ Backup</button>
    <button class="btn" onclick="__ahLogout()" title="Log out" style="margin-left:6px;">⎋ Log out</button>
</div>

<div id="sidebar-backdrop" onclick="closeSidebar()"></div>

<div id="editor-pane">

<!-- Subjects panel — visible only when editing subjects, sits left of weeks column -->
<div id="subjects-panel" style="display:none; flex-direction:column; width:180px; min-width:180px; background:#130822; border-right:1px solid #2a1a3e; overflow:hidden;">
    <div class="panel-header" style="font-size:0.72rem; padding:7px 10px; flex-shrink:0; background:#1a0830;">SUBJECTS</div>
    <div id="subject-list" class="list-container" style="flex:1; overflow-y:auto;"></div>
    <button class="btn btn-add" style="width:calc(100% - 12px); border-radius:6px; margin:5px 6px; flex-shrink:0; font-size:0.78rem; padding:6px 10px;" onclick="addSubject()">＋ Add Subject</button>
</div>

<div class="sidebar">

    <!-- Navigation only -->
    <div class="sidebar-nav" id="sidebar-nav">

        <div class="nav-section-label">Content</div>
        <div class="nav-btn" id="nav-subjects" onclick="toggleSubjectsTab()">📋 Subjects</div>
        <div class="nav-btn" id="nav-schedule" onclick="toggleSchedule()">📅 Semester Map</div>
        <div class="nav-btn" id="nav-useful" onclick="toggleUsefulLinks()">🔗 Useful Links</div>

        <div class="nav-section-label" style="margin-top:4px;">Academic</div>
        <div class="nav-btn" id="nav-midterms" onclick="toggleMidterms()">📝 Midterms / Finals</div>
        <div class="nav-btn" id="nav-staff" onclick="toggleStaffDirectory()">👥 Staff Contacts</div>
        <div class="nav-btn" id="nav-timetable" onclick="toggleTimetableManager()">🗓️ Timetable</div>

        <div class="nav-section-label" style="margin-top:4px;">Publishing</div>
        <div class="nav-btn" id="nav-announcements" onclick="toggleUpdatesManager()">📣 Announcements</div>

        <div class="nav-section-label" style="margin-top:4px;">System</div>
        <div class="nav-btn" id="nav-config" onclick="toggleConfig()">⚙️ Config</div>

    </div>

</div>

<div class="middle" id="middle-col">
    </div>

<div class="main">
    <div id="editor-area" style="max-width: 900px; margin: 0 auto; width: 100%;">
        <div style="text-align:center; color:#666; margin-top:50px;">Select a subject and list item.</div>
    </div>
</div>

</div>

<script src="course_data.js"></script>
<!-- Supabase login + live save (Phase 4) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>
<script src="admin-auth.js"></script>
</body>
</html>
